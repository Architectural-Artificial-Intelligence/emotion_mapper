# Versions below are Tauri v2 major-version pins, not verified against a live
# `cargo add` (no Rust toolchain was available when this was written) --
# run `cargo update` after first build to resolve exact current 2.x releases.
[package]
name = "emotion-mapper"
version = "1.0.0"
description = "Emotion Mapper desktop shell"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = "2"
tokio = { version = "1", features = ["time", "rt"] }

[[bin]]
name = "emotion-mapper"
path = "src/main.rs"
